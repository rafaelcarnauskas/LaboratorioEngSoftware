# Configuração do Alembic do Backend (Requisito 13.8).
# Rode os comandos a partir de backend/, por exemplo: alembic upgrade head
#
# A URL do banco NÃO fica aqui: alembic/env.py lê carregar_configuracao().database_url
# (CHOOSEN_DATABASE_URL, depois DATABASE_URL, padrão sqlite:///<backend>/choosen.db).

[alembic]
script_location = %(here)s/alembic

# Nome dos arquivos novos: <rev>_<slug>.py, como 0001_autenticacao_inicial.py.
file_template = %%(rev)s_%%(slug)s

# Põe backend/ no sys.path para o env.py importar o pacote app.
prepend_sys_path = .

path_separator = os

# Horários dos cabeçalhos das revisões em UTC.
timezone = UTC

output_encoding = utf-8


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
